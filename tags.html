<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thematic Index Filter</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 1. PASTE THIS SIDEBAR ELEMENT RIGHT AT THE TOP OF THE BODY: -->
    <div class="book-spine-sidebar">
        <div class="spine-text">The Mathematicians' Library</div>
    </div>

    <!-- 2. WRAP EVERYTHING ELSE INSIDE THIS MAIN CONTAINER: -->
    <div class="site-content-wrapper">

<header>
    <h1>The Mathematicians' Library</h1>
    <p>Official Digital Appendix & Companion Hub</p>
    <div class="nav-menu">
        <span class="nav-label">View books:</span>
        <a href="index.html" class="nav-btn" id="nav-chapter">by Chapter</a>
        <a href="map.html" class="nav-btn" id="nav-map">on a Map</a>
        <a href="timeline.html" class="nav-btn" id="nav-timeline">on a Timeline</a>
        <a href="tags.html" class="nav-btn active" id="nav-tags">by Theme</a>
        <a href="about.html" class="nav-btn" id="nav-about">About</a>
    </div>
</header>
<main>
    <h2>Explore by Theme: <span id="active-tag-label">All</span></h2>
    <div style="margin-bottom:20px; background:#fff; padding:15px; border:1px solid var(--border-light); border-radius:4px;">
        <label for="sort-select" style="font-weight:bold; color:var(--text-muted);">Sort Results By: </label>
        <select id="sort-select" style="padding:5px; font-size:1rem; border-radius:4px; border:1px solid var(--border-light);">
            <option value="date-asc">Chronological (Oldest First)</option>
            <option value="title-asc">Title (A - Z)</option>
            <option value="author-asc">Author (A - Z)</option>
        </select>
    </div>
    <div class="grid-list" id="tag-results-container"></div>
</main>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetTag = urlParams.get('tag');
    let masterBooks = [];
    if(targetTag) document.getElementById('active-tag-label').innerText = '#' + targetTag;
        fetch('data.json')
        .then(res => res.json())
        .then(books => {
            // FILTER: Keep only items where type is 'book' (or missing, which defaults to book)
            // This safely sweeps away milestones and events so they don't cause errors here
            const onlyBooks = books.filter(b => b.type === 'book' || !b.type);

            // Now apply the tag filtering to ONLY the book array
            masterBooks = targetTag ? onlyBooks.filter(b => b.tags.includes(targetTag)) : onlyBooks;
            renderCards();
        });

    document.getElementById('sort-select').addEventListener('change', renderCards);
    function renderCards() {
        const sortType = document.getElementById('sort-select').value;
        if (sortType === 'date-asc') masterBooks.sort((a,b) => a.sort_val - b.sort_val);
        if (sortType === 'title-asc') masterBooks.sort((a,b) => a.title.localeCompare(b.title));
        if (sortType === 'author-asc') masterBooks.sort((a,b) => a.author.localeCompare(b.author));
        const container = document.getElementById('tag-results-container');
        container.innerHTML = '';
        masterBooks.forEach(book => {
            container.innerHTML += '<div class="book-card">' +
                '<a href="' + book.url + '"><img src="' + book.image + '" alt="' + book.alt_text + '"></a>' +
                '<div class="card-title"><a href="' + book.url + '">' + book.title + '</a></div>' +
                '<div class="meta-row">By ' + book.author + '</div>' +
                '<div class="meta-row">Date: ' + book.display_date + '</div>' +
                '</div>';
        });
    }
</script>

</div>

</body>
</html>
